  q.addEventListener('keydown', function(e){
    if(ql.hidden) return;
    if(e.key==='ArrowDown'){ hi=Math.min(hi+1,hits.length-1); renderList(); e.preventDefault(); }
    else if(e.key==='ArrowUp'){ hi=Math.max(hi-1,0); renderList(); e.preventDefault(); }
    else if(e.key==='Enter'){ var d=hits[hi>=0?hi:0]; if(d){ pick(d.key); e.preventDefault(); } }
    else if(e.key==='Escape'){ closeList(); }
  });
  ql.addEventListener('mousedown', function(e){ var li=e.target.closest('li'); if(li){ e.preventDefault(); pick(li.getAttribute('data-go')); } });
  q.addEventListener('blur', function(){ setTimeout(closeList,100); });
  function pick(key){ q.value=byKey[key].n; closeList(); go(key);
    if(window.innerWidth<=760) $('tsm-panel').scrollIntoView({behavior:'smooth',block:'nearest'}); }

  // Discourage bulk copying of the panel text.
  ['copy','cut'].forEach(function(t){ sr.addEventListener(t, function(e){ if(e.target!==q) e.preventDefault(); }); });


  refresh();
  }
})();
</script>
