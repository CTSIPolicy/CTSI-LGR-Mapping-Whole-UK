    }
    h += '<h3>'+esc(d.n)+'</h3><p class="tsm-sub">'+esc(catOf(d,'today','type')[1])+' · '+NATS[d.nat]+'</p><dl>'+
      '<dt>Trading Standards model</dt><dd>'+pill(d,'today','model')+(d.mt && ['Independent','Standalone service','Joint service','Partial function sharing','Shared service'].indexOf(d.mt)<0 ? '<br><span style="color:var(--muted)">'+esc(d.mt)+'</span>' : '')+'</dd>';
    d.p.forEach(function(p){ var others = byPartner[p].filter(function(c){ return c!==d.c; });
      h += '<dt>Partnership</dt><dd><b>'+esc(p)+'</b>'+(others.length ? '<div class="tsm-chips">'+others.map(function(c){ return chip(c); }).join('')+'</div>' : '')+'</dd>'; });
    if(d.sw) h += '<dt>Arrangement</dt><dd>'+esc(d.sw)+'</dd>';
    if(d.pd) h += '<dt>Where it sits in the council</dt><dd>'+esc(d.pd)+'</dd>';
    h += '<dt>Political control</dt><dd>'+polLine(d)+'</dd>';
    if(d.nat==='E'){
      h += '<dt>Reorganisation</dt><dd>'+pill(d,'today','lgr')+(d.lt && d.lg!=='none' ? '<br>'+esc(d.lt) : '')+'</dd>';
      if(d.b.length){
        h += '<dt>'+(d.lg==='confirmed'?'Becomes part of':'Proposed to become part of')+'</dt><dd><div class="tsm-chips">'+d.b.map(function(k){ return chip('F:'+k,'fut'); }).join('')+'</div></dd>';
        var maps = []; d.b.forEach(function(k){ var u=futOf(k).map; if(u && maps.indexOf(u)<0) maps.push(u); });
        if(maps.length) h += '<dt>Proposed boundaries</dt><dd>'+maps.map(function(u){ return mapBlock(u,'Map of the proposed authorities replacing '+shortName(d.n)); }).join('<br>')+'</dd>';
      }
    }
    el.innerHTML = h+'</dl>';
  }
  $('tsm-panel').addEventListener('click', function(e){
    if(e.target.closest('.tsm-close')) return select(null);
    var b=e.target.closest('[data-go]'); if(b) go(b.getAttribute('data-go'));
  });
  function select(key){ selected = key; paint(); showPanel(); }
  // open an item, switching map or nation if it isn't on the current one
  function go(key){ var d=byKey[key]; if(!d) return;
    if(!d.ni && !inNation(d)){ nation='UK'; zoomTo('UK'); }
    if(!visible(d)){ selected = key; setView(d.kind==='fut' ? 'future' : 'today', true); }
    else refresh();
    select(key); }

  // ----------------------------------------------------------- map pointer --
  // Hovering shows an area in the panel on the right; clicking pins it there.
  svg.addEventListener('mousemove', function(e){
    var k = e.target.__key || null;
    if(k!==hovered){ hovered=k; paint(); showPanel(); }
  });
  svg.addEventListener('mouseleave', function(){ if(hovered){ hovered=null; paint(); showPanel(); } });
  svg.addEventListener('click', function(e){ if(moved){ moved=false; return; } var k=e.target.__key; select(k && k!==selected ? k : null); });

  // ------------------------------------------------------------------ search --
  var ALL = D.concat(FUT), q=$('tsm-q'), ql=$('tsm-qlist'), hits=[], hi=-1;
  function closeList(){ ql.hidden=true; q.setAttribute('aria-expanded','false'); hi=-1; }
  function renderList(){
    ql.innerHTML = hits.map(function(d,i){ return '<li role="option" id="tsm-o'+i+'" data-go="'+esc(d.key)+'" aria-selected="'+(i===hi)+'">'+esc(d.n)+
      '<small>'+(d.kind==='fut' ? 'after reorganisation' : NATS[d.nat])+'</small></li>'; }).join('');
    ql.hidden = !hits.length; q.setAttribute('aria-expanded', String(!!hits.length));
    if(hi>=0) q.setAttribute('aria-activedescendant','tsm-o'+hi); else q.removeAttribute('aria-activedescendant');
  }
  q.addEventListener('input', function(){
    var s=q.value.trim().toLowerCase(); hi=-1;
    hits = s.length<2 ? [] : ALL.filter(function(d){ return d.n.toLowerCase().indexOf(s)>=0 ||
      (d.p||[]).some(function(p){ return p.toLowerCase().indexOf(s)>=0; }); }).slice(0,14);
    renderList();
  });
  q.addEventListener('keydown', function(e){
    if(ql.hidden) return;
    if(e.key==='ArrowDown'){ hi=Math.min(hi+1,hits.length-1); renderList(); e.preventDefault(); }
    else if(e.key==='ArrowUp'){ hi=Math.max(hi-1,0); renderList(); e.preventDefault(); }
    else if(e.key==='Enter'){ var d=hits[hi>=0?hi:0]; if(d){ pick(d.key); e.preventDefault(); } }
    else if(e.key==='Escape'){ closeList(); }
  });
  ql.addEventListener('mousedown', function(e){ var li=e.target.closest('li'); if(li){ e.preventDefault(); pick(li.getAttribute('data-go')); } });
  q.addEventListener('blur', function(){ setTimeout(closeList,100); });
  function pick(key){ q.value=byKey[key].n; closeList(); go(key);
    if(window.innerWidth<=760) $('tsm-panel').scrollIntoView({behavior:'smooth',block:'nearest'}); }

  // Discourage bulk copying of the panel text.
  ['copy','cut'].forEach(function(t){ sr.addEventListener(t, function(e){ if(e.target!==q) e.preventDefault(); }); });


  refresh();
  }
})();
</script>
